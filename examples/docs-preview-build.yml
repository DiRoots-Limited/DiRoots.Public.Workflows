name: Docs preview build

on:
  pull_request:
    branches: [gh-pages]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    uses: DiRoots-Limited/DiRoots.Public.Workflows/.github/workflows/docs-preview-build.yml@REVIEWED_COMMIT_SHA
    with:
      # Public docs site URL, including any project path. Written here rather than read
      # from a variable: variables are not passed to pull requests from forks.
      site-url: https://docs.example.diroots.com
    # No secrets mapping and never secrets: inherit.
